name: cadcast estimation plugin for cura
description: technical documentation hosted in static html generated by sphinx

commands:
  build:
    unix: rm -rf build & sphinx-build -b html ./source ./build
  runserver:
    unix: python -m http.server --directory ./build

env_specs:
  default:
    packages:
      - python
      - sphinx=9.1.0
      - myst-parser
    channels:
      - defaults
      - conda-forge

channels:
  - defaults
  - conda-forge
