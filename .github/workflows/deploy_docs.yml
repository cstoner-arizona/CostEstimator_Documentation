name: Deploy Docs to GitHub Pages

# Deploy only on push and PR to main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build from Sphinx source
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          conda-remove-defaults: true

      - name: Install anaconda-project
        run: conda install -y -c conda-forge anaconda-project
        shell: bash -el {0}

      - name: Build Sphinx docs
        run: anaconda-project run build
        shell: bash -el {0}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  # Deploy from ./build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Stops deploy job if PR, only deploy after PR accepted.
    if: github.even_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}

    steps:
      - name: Deploy to GH Pages
        id: deployment
        uses: actions/deploy-pages@v4
